services:
  - type: web
    name: tubeswift-hosted
    env: python
    plan: starter
    buildCommand: pip install -r requirements-hosted.txt
    startCommand: uvicorn tubeswift.hosted_api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: tubeswift-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TUBESWIFT_STORAGE_ROOT
        value: /var/data/downloads
      - key: TUBESWIFT_CORS_ORIGINS
        sync: false
